<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWS 8 JULI 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
            font-family: 'Courier New', Courier, monospace;
            background: #1a2a3a; /* biru laut gelap */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .kartu {
            background: #b8dcf0; /* biru laut muda */
            padding: 45px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-radius: 6px;
        }       

         .judul-atas {
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #0a2540;
            letter-spacing: 1.5px;
            margin-bottom: 24px;
        }

        .garis {
            border: none;
            border-top: 1.5px solid #0a2540;
            margin-bottom: 28px;
        }

        .nama {
            text-align: center;
            font-size: 0.88rem;
            font-weight: bold;
            color: #0a2540;
            line-height: 1.7;
            margin-bottom: 30px;
        }

         .grup-input {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
        }

        #inputLokasi {
            flex: 1;
            padding: 8px 14px;
            border: 1.5px solid #0a2540;
            background: #e8f4fc;
            font-family: 'Courier New', monospace;
            font-size: 0.88rem;
            color: #0a2540;
            outline: none;
            border-radius: 3px;
        }

        #inputLokasi:focus { background: #fff; }

        #tombolCari {
            padding: 8px 20px;
            background: #0a2540;
            color: #b8dcf0;
            border: 1.5px solid #0a2540;
            font-family: 'Courier New', monospace;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }

        #tombolCari:hover { background: #b8dcf0; color: #0a2540; }
        #tombolCari:disabled { opacity: 0.5; cursor: not-allowed; }

        .baris-hasil {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            gap: 16px;
            border-bottom: 1px solid rgba(10, 37, 64, 0.15);
        }
